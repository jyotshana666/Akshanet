services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akshanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akshanet_dev}
      POSTGRES_DB: ${POSTGRES_DB:-akshanet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akshanet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-akshanet}:${POSTGRES_PASSWORD:-akshanet_dev}@postgres:5432/${POSTGRES_DB:-akshanet}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-akshanet-uploads}
      JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-chars-long!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-32-chars-long!!}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      APAAR_API_URL: ${APAAR_API_URL:-http://localhost:9999}
      APAAR_API_KEY: ${APAAR_API_KEY:-mock-key}
      APAAR_MOCK: "true"
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      API_PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./apps/ml-service
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/model.pkl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  institution-portal:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  student-pwa:
    build:
      context: .
      dockerfile: apps/student-pwa/Dockerfile
    restart: unless-stopped

  aicte-dashboard:
    build:
      context: .
      dockerfile: apps/aicte-dashboard/Dockerfile
    restart: unless-stopped

  employer-portal:
    build:
      context: .
      dockerfile: apps/employer/Dockerfile
    restart: unless-stopped

  nginx:
    build: ./apps/nginx
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
    depends_on:
      - api
      - institution-portal
      - student-pwa
      - aicte-dashboard
      - employer-portal

volumes:
  postgres_data:
  redis_data:
  minio_data:
